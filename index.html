function secSet(){
 return `<div class="grid g2"><div class="card"><h3>🔑 Rehber şifresi</h3><form data-form="_pw"><div class="fm" style="grid-template-columns:1fr">${db.pwHash?'<label>Mevcut şifre<input name="old" type="password" autocomplete="current-password"></label>':''}<label>Yeni şifre (en az 4 karakter)<input name="p1" type="password" autocomplete="new-password"></label><label>Yeni şifre (tekrar)<input name="p2" type="password" autocomplete="new-password"></label></div><div class="row"><button class="btn" type="submit">${db.pwHash?'Şifreyi değiştir':'Şifre belirle'}</button>${db.pwHash?B('Şifreyi kaldır','pwOff',{},'btn danger'):''}</div></form><p class="mu mt">Şifre cihazda düz metin değil, SHA-256 özeti olarak saklanır. Unutulursa veriler ancak yedekten geri yüklenerek kurtarılabilir.</p></div>
 <div class="card"><h3>🛡️ Koruma</h3><label class="lbl-block">Otomatik kilit<select data-c="lock">${[[0,'Kapalı'],[5,'5 dakika'],[15,'15 dakika'],[30,'30 dakika'],[60,'1 saat']].map(o=>`<option value="${o[0]}" ${+db.lock===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label><label class="switch mt"><input type="checkbox" data-c="mask" ${db.mask?'checked':''}> İsimleri gizle (projeksiyon/akıllı tahta için)</label><p class="mu" style="margin-top:8px">Öğrenciler şifresiz, ad-soyad yazarak girer. Bu nedenle öğrenci ekranında ilişki puanı, görüşme ve davranış kayıtları gibi hassas bilgiler gösterilmez.</p><div class="callout mt">ℹ️ Bu uygulama verileri yalnızca bu tarayıcıda tutar. Ortak bilgisayarda kullanmayın, işiniz bitince <b>Kilitle</b>’ye basın ve düzenli yedek alın. Öğrenci verisi KVKK kapsamında kişisel veridir.</div></div></div>`;
}
SUBMIT._pw=(k,f)=>{const old=f.elements.old?.value||'',a=f.elements.p1.value,b=f.elements.p2.value;if(db.pwHash&&hashPw(old)!==db.pwHash)return toast('Mevcut şifre yanlış.','err');if(a.length<4)return toast('Yeni şifre en az 4 karakter olmalı.','err');if(a!==b)return toast('Yeni şifreler aynı değil.','err');db.pwHash=hashPw(a);db.pwDefault=false;save();render();toast('🔐 Şifre güncellendi.')};
ACT.pwOff=()=>{const old=prompt('Şifreyi kaldırmak için mevcut şifreyi girin:');if(old==null)return;if(hashPw(old)!==db.pwHash)return toast('Şifre yanlış.','err');db.pwHash='';db.pwDefault=false;save();render();toast('Şifre koruması kapatıldı.','err')};
CH.lock=v=>{db.lock=+v;save()};CH.mask=v=>{db.mask=!!v;save();render()};CH.reqPin=v=>{db.requirePin=!!v;save()};
function studentsSet(){
 const smp=db.students.filter(x=>x.sample).length;
 return card('👩‍🎓 Öğrenci listesi',db.students.length?`<div class="tw"><table><thead><tr><th></th><th>Ad soyad</th><th>Sınıf</th><th>Fotoğraf</th><th></th></tr></thead><tbody>${db.students.map(s=>`<tr><td>${avatar(s)}</td><td><input data-c="sName" data-id="${E(s.id)}" value="${E(s.name)}" maxlength="80" aria-label="Ad soyad"></td><td style="width:110px"><input data-c="sClass" data-id="${E(s.id)}" value="${E(s.sinif)}" maxlength="20" aria-label="Sınıf"></td><td><label class="btn ghost sm" style="cursor:pointer">📷<input type="file" accept="image/*" data-c="sPhoto" data-id="${E(s.id)}" hidden></label>${s.avatar?.photo?`<button type="button" class="icon-btn" data-a="sPhotoDel" data-id="${E(s.id)}" aria-label="Fotoğrafı sil">✕</button>`:''}</td><td>${B('🗑️','sDel',{id:s.id},'icon-btn')}</td></tr>`).join('')}</tbody></table></div><p class="mu">Ad ve sınıf kutusunda değişiklik yapıp alandan çıkınca kaydedilir. Öğrenci girişte adını buradaki gibi yazar (büyük/küçük harf ve Türkçe karakter fark etmez). Aynı ad soyadlı öğrenciler sınıflarıyla ayırt edilir.</p>`:empty('👩‍🎓','Öğrenci yok.'))+addStudentCard(!db.students.length)+
 card('🧪 Kurgusal örnek sınıf',`<p>15 kurgusal öğrenci (5 destek gereken, 5 orta, 5 iyi düzey). Uygulamayı tanımak içindir; gerçek öğrencilere karışmaz ve sildiğinizde <b>geri gelmez</b>.</p><div class="row">${B('🧪 Örnek sınıfı yükle','loadSamples',{},'btn soft')}${smp?B(`🗑️ ${smp} örnek öğrenciyi sil`,'delSamples',{},'btn danger'):''}</div>`);
}
const findS=id=>db.students.find(x=>same(x.id,id));
CH.sName=(v,d)=>{const s=findS(d.id);if(s&&v.trim()){s.name=v.trim().slice(0,80);save();toast('Ad güncellendi.')}};
CH.sClass=(v,d)=>{const s=findS(d.id);if(s){s.sinif=v.trim().slice(0,20);save()}};
CH.sPin=(v,d,el)=>{const s=findS(d.id);v=v.trim();if(!s||!v)return;if(v.length<4)return toast('PIN en az 4 karakter olmalı.','err');s.pinHash=hashPin(s.id,v);save();el.value='';render();toast('🔑 '+s.name+' için PIN kaydedildi.')};
CH.sPhoto=(v,d,el)=>{const s=findS(d.id),file=el.files?.[0];if(!s||!file)return;if(!/^image\//.test(file.type))return toast('Görsel dosyası seçin.','err');shrinkImage(file,160,.8).then(url=>{s.avatar=s.avatar||{};const old=s.avatar.photo;s.avatar.photo=url;if(!save()){s.avatar.photo=old}render()}).catch(()=>toast('Görsel açılamadı.','err'))};
ACT.sPhotoDel=d=>{const s=findS(d.id);if(s?.avatar){delete s.avatar.photo;save();render()}};
ACT.sDel=d=>{const s=findS(d.id);if(!s)return;if(prompt(`“${s.name}” ve TÜM kayıtları kalıcı olarak silinecek. Onaylamak için öğrencinin adını yazın:`)?.trim()!==s.name.trim())return toast('Ad eşleşmedi; silme iptal edildi.');db.students=db.students.filter(x=>x!==s);if(same(db.cur,s.id))db.cur=db.students[0]?.id??null;save();render();toast('Öğrenci silindi.')};
ACT.delSamples=()=>{const n=db.students.filter(x=>x.sample).length;if(!confirm(n+' kurgusal örnek öğrenci silinsin mi? Gerçek öğrenciler etkilenmez.'))return;db.students=db.students.filter(x=>!x.sample);if(!db.students.some(x=>same(x.id,db.cur)))db.cur=db.students[0]?.id??null;save();render();toast('Örnek öğrenciler silindi.')};
function shrinkImage(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function aboutSet(){return `<div class="grid g2"><div class="card"><h3>🎓 LGS Rehberlik Paneli <span class="pill ac">v${APP_VER}</span></h3><p>Rehber öğretmenlerin her öğrenciyi notlarının yanında kitap, proje, spor, sanat, ilişkiler ve sosyal yaşamıyla birlikte bütüncül izlemesi için tasarlanmıştır. İnternet gerektirmez; tek dosyadır.</p><h4>v6.0’daki başlıca değişiklikler</h4><ul style="margin:0;padding-left:1.2em;font-size:.92em"><li>Sade arayüz: 37 sekme yerine 10 ana bölüm</li><li>Katsayılı (×4 / ×1) yaklaşık LGS puanı</li><li>Sönümlü eğilim ve olası aralıklı tahmin</li><li>Tek dijital ikiz formülü — her ekranda aynı sonuç</li><li>Şifre özetleme ve otomatik kilit; öğrenciler şifresiz, ad-soyadla girer</li><li>Öğrenci eklemeleri rehber onayına bağlı; ilişki puanı, görüşme ve davranış kayıtları öğrenciye kapalı</li><li>Kişiye özel tema; yeni temalar</li><li>Yeniden çizilen, mevsimli Başarı Ağacı</li><li>Kütüphanesiz Excel/JSON yedek; kayıt hatası uyarısı</li></ul></div><div class="card"><h3>🧮 Hesaplamalar</h3><p><b>≈ LGS puanı</b> = 100 + 400 × ağırlıklı net ÷ 270. Ağırlıklı net = 4×(Türkçe + Matematik + Fen) + İnkılap + Din + İngilizce. Gerçek puan, o yılın standart puanlarıyla hesaplanır.</p><p><b>Ders gücü</b> = deneme ortalaması %60 + ders notu %40.</p><p><b>Akademik</b> = ders notu ortalaması ile son denemenin ağırlıklı yüzdesinin ortalaması.</p><p><b>Sosyal</b> = ilişki puanları %50 + etkinlik altını %30 + davranış %20.</p><p><b>Durum</b>: Destek öncelikli (2+ uyarı veya akademik &lt; 50) · İyi gidiyor (uyarı yok ve akademik ≥ 70) · diğerleri Takipte.</p><p class="mu">Tüm göstergeler rehberlik amaçlıdır; tanı veya karar aracı değildir.</p></div></div>`}

P.rapor=(s,a)=>{
 const r=risks(s,a),f=a.n?forecast(a,db.lgs):null,books=a.acts.filter(x=>x.tur==='Kitap okuma'),c=careerFit(s,a).slice(0,3);
 const ctl=`<div class="card no-print"><div class="card-head"><h3>🖨️ Rapor seçenekleri</h3><div class="row">${B('📄 Yazdır / PDF','print',{},'btn')}${B('📋 Özeti kopyala','copySum',{},'btn ghost')}${B('💬 WhatsApp','waSum',{},'btn ghost')}</div></div><label class="switch"><input type="checkbox" data-c="rep" data-k="adv" ${UI.rep.adv?'checked':''}> Önerileri ekle</label><label class="switch"><input type="checkbox" data-c="rep" data-k="sens" ${UI.rep.sens?'checked':''}> Hassas bölümleri ekle (ilişki puanları, devamsızlık, dikkat edilecekler) — yalnızca rehber dosyası için</label><p class="mu">Veli raporunda hassas bölümleri kapalı tutmanız önerilir. PDF için yazdırma penceresinde “PDF olarak kaydet”i seçin.</p></div>`;
 let h=`<div class="card"><div class="row between"><div><h2 style="margin:0">${E(s.name)} — Gelişim raporu</h2><p class="mu">${E(db.ui.okul||'')}${db.ui.okul?' · ':''}${E(s.sinif)} · ${new Date().toLocaleDateString('tr-TR')} · LGS’ye ${Math.max(0,daysTo(db.lgs))} gün</p></div>${avatar(s,'lg')}</div>`;
 h+=`<div class="kpis mt">${kpi('Son deneme',a.lastTot!=null?rd(a.lastTot)+' / 90':'—',a.lastW!=null?'≈ '+rd(lgsPuan(a.lastW),0)+' puan':'')}${kpi('Deneme sayısı',a.n)}${kpi('Akademik',a.acad!=null?'%'+Math.round(a.acad):'—')}${kpi('Okunan kitap',books.length)}${kpi('Tamamlanan görev',s.plan.filter(x=>x.durum==='Yapıldı').length+' / '+s.plan.length)}${kpi('Seviye',lvl(a.gold),a.gold+' altın')}</div>`;
 h+=`<h3>📈 Deneme gelişimi</h3>${examChart(a,false)}<div class="grid g2 mt"><div><h3>📚 Ders gücü</h3>${subjectBars(a)}</div><div><h3>🎯 Konu ve çalışma</h3>${hbars([{label:'Tamamlanan konu',value:s.topics.length?s.topics.filter(x=>x.durum==='Tamamlandı').length/s.topics.length*100:0,right:s.topics.filter(x=>x.durum==='Tamamlandı').length+' / '+s.topics.length,color:'var(--ok)'},{label:'Çözülen yanlış',value:s.mistakes.length?s.mistakes.filter(x=>x.durum==='Çözüldü').length/s.mistakes.length*100:0,right:s.mistakes.filter(x=>x.durum==='Çözüldü').length+' / '+s.mistakes.length}])}${f?`<p class="mt">LGS günü için olası aralık: <b>${rd(f.lo,0)}–${rd(f.hi,0)} net</b> (≈ ${rd(puanFromNet(f.lo,f.ratio),0)}–${rd(puanFromNet(f.hi,f.ratio),0)} puan). <span class="mu">Yaklaşık bir göstergedir.</span></p>`:''}${s.hedef.okul?`<p>Hedef: <b>${E(s.hedef.okul)}</b>${num(s.hedef.taban)?' · taban ≈ '+rd(num(s.hedef.taban),2):''}</p>`:''}</div></div>`;
 if(books.length||a.acts.length)h+=`<h3 class="mt">🏅 Etkinlikler ve okumalar</h3><p>${a.acts.map(x=>`${{'Kitap okuma':'📖','Spor':'🏃','Kültürel gezi':'🗺️'}[x.tur]||'🏅'} ${E(x.ad)}`).join(' · ')}</p>`;
 const bd=badges(s,a);if(bd.length)h+=`<h3>🎖️ Rozetler</h3><p>${bd.map(x=>x[0]+' '+E(x[1])).join(' · ')}</p>`;
 if(UI.rep.adv){h+=`<h3>💡 Öneriler</h3>${adviceList(s,a,false,!UI.rep.sens)}`;if(s.adv.length)h+=`<h3 class="mt">✍️ Rehber öğretmenin notları</h3>${s.adv.map(x=>`<p>• <b>${E(x.alan)}:</b> ${E(x.metin)}</p>`).join('')}`}
 if(c.length)h+=`<h3 class="mt">🧭 Keşfedilebilecek alanlar</h3><p>${c.map(x=>E(x.c[0])).join(', ')} <span class="mu">(keşif amaçlıdır)</span></p>`;
 if(UI.rep.sens)h+=`<h3 class="mt">🚦 Dikkat edilecekler</h3>${riskList(r)}<h3 class="mt">🤝 İlişki ve devam</h3>${hbars(RA.map(k=>({label:E(k),value:a.lr[k]!=null?(a.lr[k]-1)/4*100:0,right:a.lr[k]!=null?a.lr[k]+'/5':'—'})))}<p class="mt">Devamsızlık: ${a.absent} gün · Olumlu davranış: ${a.good} · Disiplin: ${a.disc}</p>`;
 h+=`<p class="mu mt" style="font-size:.8em">Bu rapor kayıtlardan otomatik hazırlanmıştır. Göstergeler rehberlik amaçlıdır; kesin sonuç veya tanı değildir.</p></div>`;
 return ctl+h;
};

/* xlsx yazıcı */
const xesc=v=>String(v??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colName=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
function sheetXml(rows,widths){const cell=(v,r,c,b)=>{const ref=colName(c)+(r+1);if(typeof v==='number'&&isFinite(v))return `<c r="${ref}"${b?' s="1"':''}><v>${v}</v></c>`;const t=xesc(String(v??'').slice(0,32000));return `<c r="${ref}" t="inlineStr"${b?' s="1"':''}><is><t xml:space="preserve">${t}</t></is></c>`};
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${widths?`<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`:''}<sheetData>${rows.map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>cell(v,i,j,i===0)).join('')}</row>`).join('')}</sheetData></worksheet>`}
function buildXlsx(pkg){

function crc32(b){let c,t=crc32.t;if(!t){t=crc32.t=new Uint32Array(256);for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}c=~0;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return (~c)>>>0}
function zipStore(files){

  const C=[];h32(C,0x02014b50);h16(C,20);h16(C,20);h16(C,0x0800);h16(C,0);h16(C,0);h16(C,0x21);h32(C,c);h32(C,d.length);h32(C,d.length);h16(C,nb.length);h16(C,0);h16(C,0);h16(C,0);h16(C,0);h32(C,0);h32(C,off);cen.push(new Uint8Array(C),nb);off+=L.length+nb.length+d.length}
 const cs=cen.reduce((t,x)=>t+x.length,0),Z=[];h32(Z,0x06054b50);h16(Z,0);h16(Z,0);h16(Z,files.length);h16(Z,files.length);h32(Z,cs);h32(Z,off);h16(Z,0);
 return new Blob([...parts,...cen,new Uint8Array(Z)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
/* xlsx okuyucu (Excel’de açılıp kaydedilmiş dosyalar dahil) */
async function unzip(buf){
 const b=new Uint8Array(buf),v=new DataView(buf);let e=-1;for(let i=b.length-22;i>=Math.max(0,b.length-65600);i--)if(v.getUint32(i,true)===0x06054b50){e=i;break}
 if(e<0)throw Error('Dosya bir Excel (.xlsx) dosyası değil.');
 const cnt=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const out={},dec=new TextDecoder();
 for(let k=0;k<cnt;k++){if(v.getUint32(p,true)!==0x02014b50)throw Error('Excel dosyası bozuk.');const m=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),kl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);const name=dec.decode(b.subarray(p+46,p+46+nl));const st=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);out[name]={m,d:b.subarray(st,st+cs)};p+=46+nl+el+kl}
 return out;
}
async function zread(z,name){const f=z[name];if(!f)return null;let d=f.d;if(f.m===8){if(typeof DecompressionStream==='undefined')throw Error('Bu tarayıcı sıkıştırılmış Excel dosyasını açamıyor; JSON yedeğini kullanın.');d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}else if(f.m!==0)throw Error('Desteklenmeyen sıkıştırma.');return new TextDecoder().decode(d)}
const xdoc=t=>new DOMParser().parseFromString(t,'application/xml');
const xall=(n,tag)=>[...n.getElementsByTagNameNS('*',tag)];
async function readXlsxBackup(buf){

 const readSheet=async sh=>{let t=sh.target.replace(/^\//,'');if(!t.startsWith('xl/'))t='xl/'+t;const doc=xdoc(await zread(z,t)||'');return xall(doc,'row').map(r=>{const row=[];xall(r,'c').forEach(c=>{const ref=c.getAttribute('r')||'',col=ref.replace(/\d+/g,'').split('').reduce((v,ch)=>v*26+ch.charCodeAt(0)-64,0)-1,ty=c.getAttribute('t');let val;if(ty==='s')val=ss[+(xall(c,'v')[0]?.textContent)]??'';else if(ty==='inlineStr')val=xall(c,'t').map(t=>t.textContent).join('');else val=xall(c,'v')[0]?.textContent??'';row[col<0?row.length:col]=val});return row})};

}
function normPkg(p){
 if(!p||typeof p!=='object')throw Error('Dosyada geçerli veri yok.');
 let students=Array.isArray(p.students)?p.students:null,settings={};

 const ids=new Set();students.forEach(s=>{if(ids.has(String(s.id)))s.id=uid();ids.add(String(s.id))});
 return {students,settings};
}
