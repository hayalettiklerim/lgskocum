<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><meta name="mobile-web-app-capable" content="yes"><title>LGS Rehberlik Paneli</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--sf2:#f0f2f5;--tx:#1d2433;--mu:#667085;--bd:#e4e7ec;--ac:#3b5bdb;--a2:#e8590c;--ok:#2f9e44;--bad:#e03131;--warn:#f08c00;--r:14px;--gap:16px;--pad:18px;--sh:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);--ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.55 var(--ff);min-height:100vh}
[data-dark="1"]{--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
a{color:var(--ac)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:1.15rem}h2{font-size:1.35rem}h3{font-size:1.05rem}h4{font-size:.95rem;color:var(--mu);font-weight:600}
p{margin:.35em 0 .7em}
small,.mu{color:var(--mu)}
.mu{font-size:.9em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:.55em .7em;width:100%;min-width:0}
textarea{resize:vertical;min-height:4.5em}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 55%,transparent);outline-offset:1px;border-color:var(--ac)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ac)}
input[type=range]{padding:0;accent-color:var(--ac)}
input[type=color]{padding:2px;height:2.4em}
.btn{display:inline-flex;align-items:center;gap:.4em;border:1px solid transparent;background:var(--ac);color:#fff;border-radius:10px;padding:.5em .95em;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.3}
[data-dark="1"] .btn{color:#0b0f17}
.btn:hover{filter:brightness(1.06)}
.btn:focus-visible,.nav button:focus-visible,.chip:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 50%,transparent);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--bd)}
.btn.ghost:hover{background:var(--sf2);filter:none}
.btn.soft{background:color-mix(in srgb,var(--ac) 12%,var(--sf));color:var(--ac)}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--bd))}
.btn.ok{background:var(--ok)}
.btn.sm{padding:.3em .6em;font-size:.85em;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{background:transparent;border:0;cursor:pointer;padding:.3em .45em;border-radius:8px;color:var(--mu)}
.icon-btn:hover{background:var(--sf2);color:var(--tx)}

/* ---------- düzen: masaüstü kenar çubuğu · tablet ikon rayı · telefon alt sekmeler ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:14px;padding:16px 12px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;min-width:0;padding:2px 6px}
.brand .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,var(--a2)));color:#fff;font-size:19px;flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 35%,transparent)}
.brand .bt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.brand .bt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bt small{font-weight:500;font-size:.75em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;text-align:left;background:transparent;border:0;border-radius:11px;padding:.62em .8em;cursor:pointer;color:var(--tx);font-weight:550;font-size:.95em}
.nav button .ic{width:1.5em;text-align:center;font-size:1.08em}
.nav button:hover{background:var(--sf2)}
.nav button.on{background:color-mix(in srgb,var(--ac) 13%,var(--sf));color:var(--ac);font-weight:700}
.nav button.on::before{content:"";position:absolute;left:-12px;top:20%;bottom:20%;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}
.nav .sep{height:1px;background:var(--bd);margin:8px 6px}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--sf2)}
.side-foot .grow{flex:1;min-width:0;font-size:.85em;line-height:1.25}
.side-foot b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main-col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 26px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);min-height:64px}
.top .ttl{min-width:0;flex:1}
.top .ttl b{display:block;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{font-size:.8em}
.top .m-brand{display:none}
.top select{width:auto;max-width:280px}
.top .acts{display:flex;gap:6px;align-items:center}
main{padding:22px 26px 48px;width:100%;max-width:1480px;margin:0 auto}
.tabbar,.drawer,.drawer-bg{display:none}
.who{display:flex;align-items:center;gap:8px;font-size:.88em;color:var(--mu)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:var(--gap)}
.page-head h2{margin:0}
.page-head p{margin:.2em 0 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--sf2);padding:4px;border-radius:12px;margin-bottom:var(--gap);width:max-content;max-width:100%}
.tabs button{background:transparent;border:0;padding:.45em .9em;border-radius:9px;cursor:pointer;color:var(--mu);font-weight:600}
.tabs button.on{background:var(--sf);color:var(--tx);box-shadow:var(--sh)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:var(--pad);box-shadow:var(--sh);margin-bottom:var(--gap);min-width:0}
.card>h3:first-child{display:flex;align-items:center;gap:8px}
.card.flat{box-shadow:none;background:var(--sf2);border-color:transparent}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-head h3{margin:0}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid>.card{margin-bottom:0}
.stack>*+*{margin-top:var(--gap)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:var(--gap)}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi small{display:block;font-size:.8em;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi b{display:block;font-size:1.6em;font-weight:750;margin:.15em 0;letter-spacing:-.02em}
.kpi span{font-size:.85em;color:var(--mu)}
.kpi .of{font-size:.5em;color:var(--mu);font-style:normal;font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.mt{margin-top:var(--gap)}
.pill{display:inline-flex;align-items:center;gap:.35em;padding:.15em .6em;border-radius:99px;font-size:.8em;font-weight:650;background:var(--sf2);color:var(--mu);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,var(--sf));color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 13%,var(--sf));color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,var(--sf));color:color-mix(in srgb,var(--warn) 80%,var(--tx))}
.pill.ac{background:color-mix(in srgb,var(--ac) 14%,var(--sf));color:var(--ac)}
.badge{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;padding:0 .4em;border-radius:99px;background:var(--bad);color:#fff;font-size:.72em;font-weight:700}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .4s}
.hbars{display:grid;gap:10px}
.hbar .lbl{display:flex;justify-content:space-between;gap:8px;font-size:.9em;margin-bottom:4px}
.hbar .lbl b{font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
.item .grow{flex:1;min-width:0}
.item.alert{border-left:3px solid var(--bad)}
.item.note{border-left:3px solid var(--ac)}
.empty{text-align:center;padding:28px 16px;color:var(--mu)}
.empty .big{font-size:2.2em;display:block;margin-bottom:6px}
.callout{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--ac) 9%,var(--sf));border:1px solid color-mix(in srgb,var(--ac) 22%,var(--bd));font-size:.92em}
.callout.warn{background:color-mix(in srgb,var(--warn) 10%,var(--sf));border-color:color-mix(in srgb,var(--warn) 35%,var(--bd))}

/* tables & forms */
.tw{overflow-x:auto;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
table{width:100%;border-collapse:collapse;font-size:.92em}
th,td{text-align:left;padding:.6em .55em;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-size:.78em;text-transform:uppercase;letter-spacing:.03em;color:var(--mu);font-weight:650;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.pending td{background:color-mix(in srgb,var(--warn) 7%,transparent)}
tbody tr:hover td{background:color-mix(in srgb,var(--sf2) 60%,transparent)}
td .acts{display:flex;gap:2px;justify-content:flex-end}
.fm{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin:4px 0 14px}
.fm label,.lbl-block{display:flex;flex-direction:column;gap:5px;font-size:.82em;font-weight:600;color:var(--mu)}
.fm label.wide{grid-column:1/-1}
.fm .err{color:var(--bad);font-weight:500}
details.fold{border:1px dashed var(--bd);border-radius:12px;padding:0 14px;margin-bottom:var(--gap)}
details.fold[open]{border-style:solid;background:var(--sf2);padding-bottom:12px}
details.fold>summary{cursor:pointer;padding:12px 0;font-weight:650;color:var(--ac);list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
.switch{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-weight:500}

/* people list */
.people{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.person{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--sf);cursor:pointer;color:var(--tx);width:100%}
.person:hover{border-color:var(--ac);box-shadow:var(--sh)}
.person .grow{flex:1;min-width:0}
.person b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;overflow:hidden;font-size:.95em}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:1.3em}

/* charts */
.chart svg{width:100%;height:auto;max-height:320px;display:block;overflow:visible}
.chart .axis{stroke:var(--bd)}
.chart text{fill:var(--mu);font-size:13px;font-family:var(--ff)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85em;color:var(--mu);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.c3d{position:relative;border-radius:12px;background:var(--sf2);overflow:hidden;touch-action:none}
.c3d canvas{display:block;width:100%;height:340px;cursor:grab}
.c3d canvas:active{cursor:grabbing}
.c3d .ctl{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.c3d .hint{position:absolute;left:10px;bottom:8px;font-size:.78em;color:var(--mu)}
.heat{display:flex;flex-wrap:wrap;gap:4px}
.heat i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* week plan */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--sf2);border-radius:12px;padding:8px;min-height:120px}
.day>b{display:block;font-size:.82em;color:var(--mu);margin:2px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.task{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:6px;font-size:.86em}
.task.done{opacity:.6}
.task.done .t{text-decoration:line-through}
.task .row{gap:4px;margin-top:6px}
.tpl{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tpl .card{margin:0;padding:14px}

/* theme gallery */
.themes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.th{border:2px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;background:none;padding:0;text-align:left;color:inherit}
.th.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.th .pv{height:86px;padding:10px;display:grid;grid-template-columns:28px 1fr;gap:6px}
.th .pv .sb{border-radius:6px}
.th .pv .mn{display:grid;gap:5px;align-content:start}
.th .pv .mn i{display:block;height:9px;border-radius:4px}
.th .pv .mn .c{height:26px;border-radius:6px}
.th .nm{padding:8px 10px;font-size:.85em;font-weight:650;display:flex;justify-content:space-between;gap:6px}
.th[disabled]{opacity:.55;cursor:not-allowed}

/* mood */
.moods{display:flex;gap:8px;flex-wrap:wrap}
.moods button{font-size:1.8em;background:var(--sf2);border:2px solid transparent;border-radius:14px;padding:.15em .35em;cursor:pointer}
.moods button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--sf))}

/* tree */
.tree-wrap{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(260px,1fr);gap:var(--gap);align-items:start}
.tree-art{border-radius:18px;overflow:hidden;background:var(--sf2);position:relative}
.tree-art svg{display:block;width:100%;height:auto}

.fruits{display:grid;gap:10px}
.fruit{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.fruit .dot{width:22px;height:22px;border-radius:50%;box-shadow:inset -3px -3px 6px rgba(0,0,0,.18),inset 2px 2px 4px rgba(255,255,255,.5)}
.fruit small{display:block;font-size:.78em}
.forest{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:600px){.forest{grid-template-columns:repeat(2,minmax(0,1fr))}}
.forest button{padding:0;border:2px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--sf);cursor:pointer;text-align:left;color:var(--tx)}
.forest button.on{border-color:var(--ac)}
.forest button span{display:block;padding:6px 10px;font-size:.8em;font-weight:600}
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(-30px,150px) rotate(220deg);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.tr-sway{animation:sway 6s ease-in-out infinite;transform-box:view-box}
.tr-fall{animation:fall 7s linear infinite}
.tr-snow{animation:fall 9s linear infinite}

/* toast */
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:100;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:.92em;animation:tin .25s ease}
.toast.err{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

.nomo *,.nomo *::before,.nomo *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.dense{--pad:13px;--gap:11px}

@media print{
 .top,.nav,.no-print,.toasts{display:none!important}
 .shell{display:block;padding:0}
 body{background:#fff;color:#000}
 .card,.kpi{box-shadow:none;break-inside:avoid;border-color:#ccc}
 :root{--bg:#fff;--sf:#fff;--sf2:#f3f3f3;--tx:#000;--mu:#444;--bd:#ccc}
}

@keyframes birdfly{0%{transform:translate(-50px,0);opacity:1}32%{transform:translate(450px,-36px);opacity:1}32.1%,100%{transform:translate(450px,-36px);opacity:0}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.55)}}
@keyframes shine{0%,100%{opacity:.15}50%{opacity:.6}}
.tr-bird{animation:birdfly 24s linear infinite}
.tr-wing{animation:flap .38s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.tr-shine{animation:shine 3s ease-in-out infinite}

/* ---------- dashboard ızgarası ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.dash>*{margin:0!important;min-width:0}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.kpi{display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden}
.kpi .ki{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.2rem;background:color-mix(in srgb,var(--kc,var(--ac)) 15%,var(--sf));flex:none}
.kpi .kb{min-width:0;flex:1}
.kpi .spark{display:block;width:100%;height:30px;margin-top:6px}
.hero{background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 20%,var(--sf)),var(--sf) 70%);border:1px solid var(--bd);border-radius:calc(var(--r) + 4px);padding:22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero h2{font-size:1.5rem;margin:0 0 4px}
.hero .deco{position:absolute;right:-10px;bottom:-24px;font-size:7rem;opacity:.12;pointer-events:none}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1px solid var(--bd);border-radius:14px;background:var(--sf2);color:var(--tx);cursor:pointer;font-weight:600;font-size:.85em}
.qa button span{font-size:1.5rem}
.qa button:hover{border-color:var(--ac)}

/* ---------- modal / kılavuz ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,24,.5);z-index:60;display:grid;place-items:center;padding:20px;animation:fade .2s}
.modal{background:var(--sf);color:var(--tx);border-radius:20px;max-width:880px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-24px;background:var(--sf);padding:6px 0 12px;margin-top:-6px;z-index:2}
@keyframes fade{from{opacity:0}}
.guide details{border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:var(--sf)}
.guide details>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
.guide details>summary::-webkit-details-marker{display:none}
.guide details>summary::after{content:"▾";margin-left:auto;color:var(--mu);transition:transform .2s}
.guide details[open]>summary::after{transform:rotate(180deg)}
.guide details>div{padding:0 18px 16px;line-height:1.65}
.guide h4{color:var(--tx);margin:14px 0 6px}
.guide ul,.guide ol{padding-left:1.25em;margin:.3em 0 .8em}
.guide li{margin:.25em 0}
.guide table{margin:8px 0}
.guide .key{background:color-mix(in srgb,var(--bad) 8%,var(--sf));border:1px solid color-mix(in srgb,var(--bad) 30%,var(--bd));border-radius:12px;padding:12px 14px;margin:8px 0}
.guide .tip{background:color-mix(in srgb,var(--ok) 9%,var(--sf));border:1px solid color-mix(in srgb,var(--ok) 30%,var(--bd));border-radius:12px;padding:12px 14px;margin:8px 0}

/* ---------- giriş ekranı ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;gap:18px;background:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 55%),radial-gradient(ellipse at 100% 100%,color-mix(in srgb,var(--a2) 14%,transparent),transparent 50%),var(--bg)}
.login-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:min(900px,100%)}
.login-cards .card{margin:0;padding:26px;display:flex;flex-direction:column;gap:6px}
.login-cards .card .lic{font-size:2.4rem;line-height:1}
.login-cards .card.stu{border-top:4px solid var(--a2)}
.login-cards .card.tch{border-top:4px solid var(--ac)}
.login-cards form{margin-top:auto}
.login .bigin{font-size:1.1em;padding:.75em .9em}
.login .full{width:100%;justify-content:center;padding:.75em}

/* ---------- 3B ağaç ---------- */
.t3d{position:relative;border-radius:18px;overflow:hidden;background:#cfe6f7;height:min(62vh,520px);min-height:340px;touch-action:none;user-select:none}
.t3d:fullscreen{height:100vh;border-radius:0}
.t3d-c{position:absolute;inset:0}
.t3d-c canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.t3d .tag,.tree-art .tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.88);color:#23312a;border-radius:99px;padding:.3em .8em;font-size:.8em;font-weight:700;backdrop-filter:blur(4px);z-index:2}
.t3d-ctl{position:absolute;right:10px;top:10px;display:grid;grid-template-columns:repeat(3,38px);gap:5px;z-index:2}
.t3b{width:38px;height:38px;border-radius:11px;border:0;background:rgba(255,255,255,.88);color:#1d2433;font-size:1.05rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center}
.t3b:hover,.t3b.on{background:#fff;outline:2px solid var(--ac)}
.t3d-hint{position:absolute;left:12px;right:12px;bottom:10px;text-align:center;font-size:.78em;color:#1d2433;background:rgba(255,255,255,.75);border-radius:99px;padding:.3em .8em;transition:opacity .6s;z-index:2;width:max-content;max-width:calc(100% - 24px);margin:auto}
.t3d-hint.off{opacity:0}
.seg{display:inline-flex;background:var(--sf2);padding:3px;border-radius:11px;gap:2px}
.seg button{border:0;background:transparent;padding:.4em .85em;border-radius:9px;font-weight:650;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:var(--sh)}
.nature{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nature input[type=range]{width:120px}

/* ---------- tablet ---------- */
@media(max-width:1100px){
 .app{grid-template-columns:88px minmax(0,1fr)}
 .side{padding:14px 8px;align-items:stretch}
 .side .brand{justify-content:center;padding:0}.side .brand .bt{display:none}
 .nav button{flex-direction:column;gap:4px;font-size:.68rem;padding:.6em .2em;text-align:center;line-height:1.15}
 .nav button .ic{font-size:1.35rem;width:auto}
 .nav button.on::before{left:-8px}
 .nav .badge{position:absolute;top:3px;right:8px;margin:0}
 .side-foot{flex-direction:column;padding:8px 4px}.side-foot .grow{display:none}
 .top{padding:10px 18px}main{padding:18px 18px 40px}
 .s2,.s3{grid-column:span 6}.s4{grid-column:span 6}.s5,.s7,.s8{grid-column:span 12}.s6{grid-column:span 6}
 .tree-wrap{grid-template-columns:1fr}
}
/* ---------- telefon ---------- */
@media(max-width:700px){
 html{font-size:15px}
 .app{grid-template-columns:1fr}
 .side{display:none}
 .top{padding:8px 12px;flex-wrap:wrap;gap:8px;min-height:0}
 .top .m-brand{display:flex}.top .ttl{display:none}
 .top select{max-width:none;flex:1 1 100%;order:5}
 .top .acts .lbl{display:none}
 main{padding:14px 12px calc(92px + env(safe-area-inset-bottom))}
 .tabbar{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--sf) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
 .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;background:none;border:0;color:var(--mu);padding:4px 0;position:relative;cursor:pointer;font-weight:600}
 .tabbar button.on{color:var(--ac)}
 .tabbar .ic{font-size:1.35rem;line-height:1.1}
 .tabbar .badge{position:absolute;top:0;left:55%}
 .drawer-bg{display:block;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;animation:fade .2s}
 .drawer{display:block;position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--sf);border-radius:22px 22px 0 0;z-index:41;padding:10px 14px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
 .drawer .grab{width:44px;height:5px;border-radius:9px;background:var(--bd);margin:2px auto 12px}
 .dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 .dgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border:1px solid var(--bd);border-radius:14px;background:var(--sf2);color:var(--tx);font-size:.78rem;font-weight:650;position:relative;cursor:pointer}
 .dgrid button.on{border-color:var(--ac);color:var(--ac)}
 .dgrid .ic{font-size:1.5rem}
 .dash{gap:10px}
 .s2,.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}
 .kpi{padding:12px}.kpi .ki{width:34px;height:34px;font-size:1rem;border-radius:10px}.kpi b{font-size:1.3em}
 .page-head h2{font-size:1.2rem}
 .tabs{width:100%;overflow-x:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap}
 .card{padding:14px}
 .grid.g2,.grid.g3{grid-template-columns:1fr}
 .login-cards{grid-template-columns:1fr}
 .week{grid-template-columns:1fr}.day{min-height:0}
 .fm{grid-template-columns:1fr 1fr}
 table.resp thead{display:none}
 table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
 table.resp tr{border:1px solid var(--bd);border-radius:12px;padding:6px 12px;margin-bottom:10px;background:var(--sf)}
 table.resp td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:6px 0;text-align:right}
 table.resp td::before{content:attr(data-l);font-weight:650;color:var(--mu);font-size:.8em;text-align:left}
 table.resp td.num{text-align:right}
 table.resp td .acts{justify-content:flex-end}
 .tw{margin:0;padding:0}
 .t3d{height:58vh;min-height:300px}
 .t3d-ctl{grid-template-columns:repeat(3,34px)}.t3b{width:34px;height:34px}
 .modal-bg{padding:0;align-items:end}.modal{border-radius:20px 20px 0 0;max-height:92vh;padding:18px}
 .forest{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@keyframes up{from{transform:translateY(100%)}}
@media print{.side,.tabbar,.drawer,.drawer-bg,.top{display:none!important}.app{display:block}main{padding:0}}
.tree-wrap.wide{grid-template-columns:1fr}
.tree-side2{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}

.fstage{position:relative}
.fstage .csvg svg{display:block;width:100%;height:auto}
.fcap{position:absolute;left:12px;bottom:12px;max-width:min(420px,calc(100% - 24px));background:rgba(255,255,255,.92);color:#1d2433;border-radius:14px;padding:10px 14px;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:3;pointer-events:none}
.fcap b{display:block;font-size:1.05em}.fcap span{font-size:.82em;color:#5b6578}.fcap p{margin:4px 0 0;font-size:.9em}
.fstage .t3d-hint{bottom:auto;top:56px}
@media(max-width:700px){.fcap{position:static;max-width:none;margin-top:10px;box-shadow:none;border:1px solid var(--bd)}}
@keyframes armType{0%,100%{transform:rotate(-58deg)}50%{transform:rotate(-52deg)}}

/* ---------- SHA-256 (çevrimdışı, file:// ile de çalışır) ---------- */
function sha256(str){
 const rr=(v,a)=>(v>>>a)|(v<<(32-a));const K=[],H=[];let p=2,c=0;
 const isP=n=>{for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
 while(c<64){if(isP(p)){if(c<8)H[c]=(Math.pow(p,1/2)*4294967296)|0;K[c]=(Math.pow(p,1/3)*4294967296)|0;c++}p++}
 const b=new TextEncoder().encode(str),l=b.length,w=[];
 for(let i=0;i<l;i++)w[i>>2]|=b[i]<<((3-i%4)*8);
 w[l>>2]|=0x80<<((3-l%4)*8);
 const nW=(((l+8)>>6)+1)*16;w[nW-1]=l*8;
 for(let i=0;i<nW;i++)w[i]=w[i]|0;
 const h=H.slice();
 for(let j=0;j<nW;j+=16){
  const x=w.slice(j,j+16);let[a,bb,cc,d,e,f,g,hh]=h;
  for(let i=0;i<64;i++){
   if(i>=16){const a15=x[i-15],a2=x[i-2];x[i]=(x[i-16]+(rr(a15,7)^rr(a15,18)^(a15>>>3))+x[i-7]+(rr(a2,17)^rr(a2,19)^(a2>>>10)))|0}
   const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+x[i])|0;
   const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;
   hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0;
  }
  h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+cc)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
 }
 return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
const hashPw=pw=>sha256('lgs6|'+pw);
const hashPin=(sid,pin)=>sha256('lgs6pin|'+sid+'|'+pin);

/* ---------- veri yükleme & göç ---------- */
function normStudent(s){
 if(!s||typeof s!=='object')return null;
 if(s.id==null||s.id==='')s.id=uid();
 s.name=String(s.name||'Adsız öğrenci');s.sinif=String(s.sinif??'');
 for(const k of LIST_KEYS){if(!Array.isArray(s[k]))s[k]=[];s[k]=s[k].filter(x=>x&&typeof x==='object');s[k].forEach(x=>{if(x.id==null||x.id==='')x.id=uid()})}
 s.hedef=s.hedef&&typeof s.hedef==='object'?s.hedef:{};
 s.prefs=s.prefs&&typeof s.prefs==='object'?s.prefs:{};
 delete s.pin;delete s.pinHash;
 // v5'te ikizlerin id'si 'twin-..' biçiminde olabiliyordu — sorun değil, karşılaştırmalar String ile.
 s.mood.forEach(m=>{m.v=cl(+m.v||3,1,5)});
 return s;
}
function migrate(d){
 if(!d||typeof d!=='object'||Array.isArray(d))d={};
 d.students=(Array.isArray(d.students)?d.students:[]).map(normStudent).filter(Boolean);
 d.ui=d.ui&&typeof d.ui==='object'?d.ui:{};
 if(typeof d.theme==='number'){d.ui.theme=OLD_THEME_MAP[d.theme]||'kagit';delete d.theme}
 if(d.ui.theme&&!THEMES.some(t=>t.id===d.ui.theme))d.ui.theme='kagit';
 if(typeof d.fs==='number'){d.ui.fs=cl(d.fs,13,22);delete d.fs}
 if(typeof d.pw==='string'){if(d.pw){d.pwHash=hashPw(d.pw);d.pwDefault=d.pw==='a1s2d3'}else d.pwHash='';delete d.pw}
 if(d.pwHash===undefined)d.pwHash=null; // null = henüz belirlenmedi
 if(!/^\d{4}-\d\d-\d\d$/.test(d.lgs||''))d.lgs='2027-06-12';
 d.lock=d.lock??15;d.requirePin=d.requirePin??true;d.mask=!!d.mask;
 // v5'teki örnek onarım bayrakları artık kullanılmıyor; silinen örnekler geri gelmez.
 delete d.samplePackInitialized;
 d.v=6;return d;
}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}return migrate(d)}

/* ---------- analiz motoru (tek kaynak) ---------- */
let CACHE=new WeakMap();
const isOk=x=>x.onay!=='bekliyor';
const netTot=e=>SUB.reduce((t,x)=>t+(num(e[x[0]])||0),0);
const netW=e=>SUB.reduce((t,x)=>t+(num(e[x[0]])||0)*x[3],0);
// Yaklaşık LGS puanı: ağırlıklı ham net 100–500 aralığına ölçeklenir. Gerçek puan standart puanla hesaplanır.
const lgsPuan=w=>cl(100+400*w/WMAX,100,500);
const gradeOf=g=>av([num(g.d1),num(g.d2)]);
const G=a=>!isOk(a)?0:(TUR[a.tur]||0)+(SEV[a.sev]||0)+cl(+a.ekstra||0,0,200);
const LEVELS=[[0,'Filiz'],[50,'Kâşif'],[150,'Usta'],[300,'Uzman'],[500,'Efsane']];
const lvl=g=>{let r=LEVELS[0];for(const L of LEVELS)if(g>=L[0])r=L;return r[1]};
const nextLvl=g=>LEVELS.find(L=>L[0]>g);
const daysTo=d=>Math.ceil((toDate(d)-toDate(today()))/864e5);

function A(s){
 if(CACHE.has(s))return CACHE.get(s);
 const ex=s.exams.filter(isOk).slice().sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||'')));
 const n=ex.length,last=n?ex[n-1]:null,prev=n>1?ex[n-2]:null;
 const grades=s.grades.filter(isOk);
 const sub={};
 for(const [k,name,m,w] of SUB){
  const nets=ex.map(e=>num(e[k])).filter(v=>v!=null);
  const avg=av(nets),lastV=last?num(last[k]):null;
  const g=grades.filter(x=>lc(x.ders).includes(SUBKEY[k]));
  const gp=av(g.map(gradeOf));
  const ep=avg==null?null:cl(avg/m*100,0,100);
  const p=ep!=null&&gp!=null?.6*ep+.4*gp:ep??gp;
  sub[k]={k,name,m,w,avg,last:lastV,ep,gp,p};
 }
 const subs=SUB.map(x=>sub[x[0]]);
 const gAv=av(grades.map(gradeOf));
 const lastPct=last?cl(netW(last)/WMAX*100,0,100):null;
 const acad=gAv!=null&&lastPct!=null?(gAv+lastPct)/2:gAv??lastPct;
 const acts=s.acts.filter(isOk),gold=sum(acts.map(G));
 const lr={};s.rel.slice().sort((a,b)=>String(a.tarih||'').localeCompare(String(b.tarih||''))).forEach(r=>{const v=num(r.puan);if(v!=null)lr[r.alan]=cl(v,1,5)});
 const ra=av(Object.values(lr));
 const att=s.att;const cnt=t=>att.filter(x=>x.tur===t).reduce((v,x)=>v+(cl(+x.adet||1,1,99)),0);
 const absent=cnt('Devamsızlık'),late=cnt('Geç kalma'),good=cnt('Olumlu davranış'),disc=cnt('Disiplin');
 // Sosyal gösterge (0–100): ilişkiler %50 + etkinlik/altın %30 + davranış %20
 const relP=ra==null?null:(ra-1)/4*100, actP=cl(gold/3,0,100), behP=cl(60+8*good-15*disc,0,100);
 const social=Math.round(relP==null?(actP*.6+behP*.4):(relP*.5+actP*.3+behP*.2));
 // eğilim: tarih (gün) – toplam net doğrusal regresyon
 const t0=n?(toDate(ex[0].tarih)||new Date()).getTime():0;
 const pts=ex.map((e,i)=>[e.tarih?(toDate(e.tarih)-t0)/864e5:i*7,netTot(e)]);
 let b=0,a0=n?pts[n-1][1]:null,sd=null;
 if(n>=2){const mx=av(pts.map(p=>p[0])),my=av(pts.map(p=>p[1])),dd=sum(pts.map(p=>(p[0]-mx)**2));b=dd?sum(pts.map(p=>(p[0]-mx)*(p[1]-my)))/dd:0;b=cl(b,-.25,.25);a0=my-b*mx;
  if(n>=3){sd=Math.sqrt(sum(pts.map(p=>(p[1]-(a0+b*p[0]))**2))/(n-2))}}
 const r={s,ex,n,last,prev,sub,subs,gAv,lastPct,acad,gold,acts,lr,ra,absent,late,good,disc,social,t0,pts,b,a0,sd,
  lastTot:last?netTot(last):null,lastW:last?netW(last):null};
 CACHE.set(s,r);return r;
}
// Sönümlenen eğilim: ilerledikçe eğilimin etkisi azalır (H=45 gün). Aralık belirsizliği büyür.
function forecast(a,date){
 if(!a.n)return null;
 const lastX=a.pts[a.n-1][0],x=(toDate(date)-a.t0)/864e5,d=Math.max(0,x-lastX),H=45,eff=H*(1-Math.exp(-d/H));
 const base=a.n>=2?(a.lastTot+(a.a0+a.b*lastX))/2:a.lastTot;
 const y=base+a.b*eff,sp=(a.sd!=null?1.3*a.sd:5)+.07*eff+(a.n<3?3:0);
 const ratio=a.lastTot>0?a.lastW/a.lastTot:3;
 return {y:cl(y,0,90),lo:cl(y-sp,0,90),hi:cl(y+sp,0,90),ratio,days:d};
}
const puanFromNet=(net,ratio)=>lgsPuan(net*ratio);

const TWIN_FOCUS=[...SUB.map(x=>x[1]),'Okuma','Spor','Müzik','Sanat','Planlı çalışma'];
const NONACAD={'Okuma':{tr:.22,all:.05,soc:6},'Spor':{all:.05,soc:10},'Müzik':{all:.04,soc:8},'Sanat':{all:.04,soc:8},'Planlı çalışma':{all:.12,soc:2}};
function twinOf(a,t){
 const b=cl(+t.boost||0,0,100)/100,f=NONACAD[t.odak];
 const nets=SUB.map(([k,name,m])=>{const base=a.sub[k].last??a.sub[k].avg??0;let g=0;if(t.odak===name||(t.odak==='Fen'&&k==='fen'))g=.5;else if(f)g=f[k]??f.all;return cl(base+(m-base)*b*g,0,m)});
 const tot=sum(nets),w=SUB.reduce((v,x,i)=>v+nets[i]*x[3],0);
 return {t,nets,tot,w,puan:lgsPuan(w),social:cl(Math.round(a.social+b*(f?f.soc:3)*2),0,100)};
}

/* risk & durum (tek kaynak) */
function risks(s,a=A(s)){
 const r=[];
 if(a.n>=3&&a.b*30<-1.5)r.push('Deneme netleri düşüş eğiliminde ('+rd(a.b*30)+' net/ay)');
 else if(a.prev&&a.lastTot-netTot(a.prev)<=-6)r.push('Son denemede belirgin düşüş ('+rd(a.lastTot-netTot(a.prev))+' net)');
 if(a.absent>=8)r.push('Devamsızlık yüksek ('+a.absent+' gün)');
 RA.forEach(k=>{if(a.lr[k]!=null&&a.lr[k]<3)r.push(k+' puanı düşük ('+a.lr[k]+'/5)')});
 if(a.disc>=2)r.push('Tekrarlayan disiplin kaydı');
 if(s.topics.filter(x=>x.durum==='Tekrar gerekli').length>=4)r.push('Çok sayıda konu tekrar bekliyor');
 const crit=a.subs.filter(x=>x.p!=null&&x.p<40);if(crit.length)r.push((crit.length>3?'Çoğu derste':crit.map(x=>x.name).join(', ')+' dersinde')+' başarı kritik düzeyde (%40 altı)');
 const m=s.mood.slice().sort((x,y)=>String(x.tarih).localeCompare(String(y.tarih))).slice(-3);
 if(m.length===3&&av(m.map(x=>x.v))<=2)r.push('Son günlerde ruh hâli düşük');
 return r;
}
const STATUS={oncelik:['Destek öncelikli','bad'],takip:['Takipte','warn'],iyi:['İyi gidiyor','ok'],veri:['Veri bekleniyor','']};
function status(s){const a=A(s),r=risks(s,a);let t='takip';if(!a.n&&a.gAv==null)t='veri';else if(r.length>=2||(a.acad!=null&&a.acad<50))t='oncelik';else if(!r.length&&a.acad!=null&&a.acad>=70)t='iyi';return {a,r,t}}

/* tavsiyeler: [alan, rehbere yönelik, öğrenciye yönelik] */
function advice(s,a=A(s)){
 const out=[],w=a.subs.filter(x=>x.p!=null).sort((x,y)=>x.p-y.p);
 if(w.length){const lo=w[0],hi=w[w.length-1];
  out.push(['Akademik',`${lo.name} en çok destek gereken ders (≈%${Math.round(lo.p)}). Haftalık 2–3 kısa konu tekrarı ve yanlış analizi planlanabilir.${lo.w===4?' Bu dersin LGS katsayısı 4 olduğundan her net ≈5,9 puan getirir.':''}`,`${lo.name} şu an en çok gelişebileceğin ders. Bu hafta 2 kısa tekrar ve 10 soruluk bir kontrol yap.${lo.w===4?' Bu dersteki her net yaklaşık 6 puan değerinde!':''}`]);
  if(w.length>1)out.push(['Güçlü yön',`${hi.name} güçlü alanı (≈%${Math.round(hi.p)}); akran öğretimi veya proje ile pekiştirilebilir.`,`${hi.name} güçlü yönün. Bu dersteki çalışma yöntemini diğer derslerde de dene.`]);}
 if(a.n>=3&&a.b*30<-1.5)out.push(['Deneme',`Netlerde düşüş eğilimi var; yanlış türleri, süre yönetimi ve uyku/yorgunluk konuşulabilir.`,`Son denemelerde küçük bir düşüş var. Yanlışlarını türlerine göre ayır; tek bir sınav seni tanımlamaz.`]);
 else if(a.n>=3&&a.b*30>1)out.push(['Deneme',`Netler ayda yaklaşık ${rd(a.b*30)} artıyor; işe yarayan çalışma alışkanlığı belirlenip sürdürülmeli.`,`Netlerin artıyor (ayda ≈${rd(a.b*30)}). Neyin işe yaradığını not et ve sürdür!`]);
 const books=a.acts.filter(x=>x.tur==='Kitap okuma').length;
 if(books<3)out.push(['Okuma',`Kitap okuma kaydı az (${books}); ayda en az bir kitap hedefi önerilebilir.`,`Ayda bir kitap hedefi koy; her kitap altın kazandırır ve paragraf netlerine yardım eder.`]);
 if(!a.acts.some(x=>x.tur==='Spor'||x.tur==='Enstrüman'))out.push(['Denge',`Spor/sanat etkinliği görünmüyor; stres yönetimi için bir hobi önerilebilir.`,`Haftana sevdiğin bir spor ya da müzik zamanı ekle; dinlenmek de çalışmanın parçası.`]);
 const tk=s.topics.filter(x=>x.durum==='Tekrar gerekli'||x.durum==='Başlanmadı');
 if(tk.length)out.push(['Konular',`${tk.length} konu tekrar/başlangıç bekliyor: ${tk.slice(0,2).map(x=>x.konu).join(', ')}.`,`${tk.length} konun seni bekliyor. İlk olarak “${tk[0].konu}” ile başlayabilirsin.`]);
 const pl=s.plan,dn=pl.filter(x=>x.durum==='Yapıldı').length;
 if(pl.length&&dn<pl.length*.5)out.push(['Plan',`Planın ${dn}/${pl.length} görevi tamamlanmış; görevler küçültülebilir.`,`Planındaki görevleri küçük parçalara böl; her tamamlanan görev ağacını büyütür.`]);
 RA.forEach(k=>{if(a.lr[k]!=null&&a.lr[k]<3)out.push(['İlişki',`${k} puanı ${a.lr[k]}/5; bireysel görüşme planlanabilir. Bu bir etiket değil, görüşme konusu.`,null])});
 if(!out.length)out.push(['Genel','Veri girdikçe öneriler ayrıntılanır.','Kayıt ekledikçe sana özel öneriler burada görünecek.']);
 return out;
}

 if(a.acts.some(x=>['İl','Ulusal','Uluslararası'].includes(x.sev)))b.push(['🏆','Madalya avcısı','İl ve üzeri başarı']);
 if(c('Spor')&&c('Enstrüman'))b.push(['🎭','Çok yönlü','Spor + müzik']);
 if(new Set(a.acts.map(x=>x.tur)).size>=5)b.push(['🌈','Gezgin ruh','5+ farklı alan']);
 if(a.gold>=150)b.push(['🪙','Altın avcısı','150+ altın']);if(a.gold>=300)b.push(['👑','Altın kral','300+ altın']);
 if(a.ra!=null&&a.ra>=4.5)b.push(['🤝','Dost canlısı','İlişki ort. 4,5+']);
 if(a.lastTot!=null&&a.lastTot>=70)b.push(['🚀','Net ustası','70+ net']);

function careerFit(s,a=A(s)){
 return CAREERS.map(c=>{let v=12,why=[];
  for(const[k,w] of Object.entries(c[2])){const p=a.sub[k].p;if(p!=null){v+=p*w;if(w>=.25)why.push(a.sub[k].name+' %'+Math.round(p))}}
  const n=a.acts.filter(x=>c[3].includes(x.tur)).length;if(n){v+=Math.min(30,n*9);why.push(n+' ilgili etkinlik')}
  return {c,p:Math.round(cl(v,0,100)),why}}).sort((x,y)=>y.p-x.p);
}

function lineChart(o){
 const W=640,H=o.h||240,L=36,R=14,T=14,B=28;
 const xs=[],ys=[];(o.series||[]).forEach(s=>s.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1])}));(o.band||[]).forEach(p=>{xs.push(p[0]);ys.push(p[1],p[2])});
 if(!xs.length)return '<div class="empty">Grafik için veri yok.</div>';
 const x0=Math.min(...xs),x1=Math.max(...xs,x0+1),y0=o.ymin??0,y1=o.ymax??Math.max(1,...ys);
 const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>H-B-(cl(y,y0,y1)-y0)/(y1-y0||1)*(H-T-B);
 const ticks=o.yticks||[0,.25,.5,.75,1].map(f=>y0+(y1-y0)*f);
 let h=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${E(o.label||'Çizgi grafik')}">`;
 ticks.forEach(v=>{h+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke-dasharray="${v===y0?'':'3 4'}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${rd(v,0)}</text>`});
 (o.xticks||[]).forEach(([x,l])=>{h+=`<text x="${X(x)}" y="${H-8}" text-anchor="middle">${E(l)}</text>`});
 (o.marks||[]).forEach(m=>{h+=`<line x1="${X(m.x)}" x2="${X(m.x)}" y1="${T}" y2="${H-B}" stroke="${m.color||'var(--mu)'}" stroke-dasharray="4 4" opacity=".7"/><text x="${X(m.x)-4}" y="${T+10}" text-anchor="end" style="font-weight:600">${E(m.label)}</text>`});
 if(o.band&&o.band.length>1){const up=o.band.map(p=>X(p[0])+','+Y(p[2])).join(' '),dn=o.band.slice().reverse().map(p=>X(p[0])+','+Y(p[1])).join(' ');h+=`<polygon points="${up} ${dn}" fill="${o.bandColor||'var(--ac)'}" opacity=".14"/>`}
 (o.series||[]).forEach(s=>{if(!s.pts.length)return;const d=s.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  if(s.area)h+=`<path d="${d} L${X(s.pts[s.pts.length-1][0])} ${H-B} L${X(s.pts[0][0])} ${H-B}Z" fill="${s.color}" opacity=".10"/>`;
  h+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="6 5"':''}/>`;
  if(s.dots!==false&&!s.dash)s.pts.forEach(p=>{h+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="var(--sf)" stroke="${s.color}" stroke-width="2.2"><title>${E((p[2]||'')+' '+rd(p[1]))}</title></circle>`})});
 h+='</svg>';
 const leg=(o.series||[]).filter(s=>s.name).map(s=>`<span><i style="background:${s.color}"></i>${E(s.name)}</span>`).join('')+(o.band&&o.bandName?`<span><i style="background:var(--ac);opacity:.3"></i>${E(o.bandName)}</span>`:'');
 return `<div class="chart">${h}${leg?`<div class="legend">${leg}</div>`:''}</div>`;
}
function hbars(rows){return `<div class="hbars">${rows.map(r=>`<div class="hbar"><div class="lbl"><span>${r.label}</span><b>${r.right??rd(r.value)}</b></div><div class="bar"><i style="width:${cl((r.value||0)/(r.max||100)*100,0,100)}%;background:${r.color||'var(--ac)'}"></i></div></div>`).join('')}</div>`}
function colChart(rows,o={}){
 if(!rows.length)return '<div class="empty">Veri yok.</div>';
 const W=640,H=o.h||220,B=34,T=18,n=rows.length,gap=(W-20)/n,bw=Math.min(54,gap*.6),max=o.max||Math.max(1,...rows.map(r=>r.value||0));
 let h=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${E(o.label||'Sütun grafik')}"><line class="axis" x1="10" x2="${W-10}" y1="${H-B}" y2="${H-B}"/>`;
 rows.forEach((r,i)=>{const x=10+i*gap+gap/2-bw/2,hh=cl((r.value||0)/max,0,1)*(H-B-T);h+=`<rect x="${x}" y="${H-B-hh}" width="${bw}" height="${Math.max(2,hh)}" rx="6" fill="${r.color||PAL[i%PAL.length]}"><title>${E(r.label)}: ${rd(r.value)}</title></rect><text x="${x+bw/2}" y="${H-B-hh-5}" text-anchor="middle" style="font-weight:650;fill:var(--tx)">${rd(r.value)}</text><text x="${x+bw/2}" y="${H-14}" text-anchor="middle">${E(String(r.label).slice(0,n>8?8:16))}</text>`});
 return `<div class="chart">${h}</svg></div>`;

<h4>Bireysel görüşmede</h4><ol><li>Önce <b>Başarı ağacını</b> birlikte açın (3B görünüm ilgi çeker); öğrencinin kendi gelişimini konuşun.</li><li><b>Öğrenci özeti</b>’nde eğilime ve ders gücüne bakın.</li><li>Birlikte <b>Plan ve hedef</b>’ten uygun zorlukta bir hazır plan seçin.</li><li>Kararı ve takip tarihini kaydedin.</li></ol>
<h4>Ayda bir</h4><ul><li>Rapor ile veli bilgilendirmesi (hassas bölümler kapalı).</li><li>Ders notları, ilişki gözlemleri ve hedeflerin güncellenmesi.</li></ul>`),
gsec('🧮 4. Değerlendirme nasıl yapılır?',`<h4>Göstergelerin anlamı</h4><div class="tw"><table><thead><tr><th>Gösterge</th><th>Nasıl hesaplanır?</th><th>Nasıl okunur?</th></tr></thead><tbody>
<tr><td>≈ LGS puanı</td><td>100 + 400 × ağırlıklı net ÷ 270. Ağırlıklı net = 4 × (Türkçe + Matematik + Fen) + İnkılap + Din + İngilizce.</td><td>Yaklaşıktır; gerçek puan o yılın standart puanlarıyla hesaplanır. Türkçe/Mat/Fen’de 1 net ≈ 5,9 puan; diğerlerinde ≈ 1,5 puan.</td></tr>
<tr><td>Ders gücü (%)</td><td>Deneme ortalaması %60 + ders notu %40.</td><td>🟢 70 ve üzeri · 🟠 50–70 · 🔴 50 altı. <b>×4</b> etiketli zayıf dersler önceliklidir.</td></tr>
<tr><td>Akademik (%)</td><td>Ders notu ortalaması ile son denemenin ağırlıklı yüzdesinin ortalaması.</td><td>Genel akademik seviye.</td></tr>
<tr><td>Sosyal (0–100)</td><td>İlişki puanları %50 + etkinlik altını %30 + davranış %20.</td><td>Görüşme konusu belirlemek içindir; etiket değildir.</td></tr>
<tr><td>Eğilim (net/ay)</td><td>Denemelerin tarih sırasıyla doğrusal eğilimi (en fazla ±7,5 net/ay ile sınırlı).</td><td>En az 3 deneme sonrası anlamlıdır. Tek bir sınava değil eğilime bakın.</td></tr>
<tr><td>LGS tahmini</td><td>Eğilim, zamanla etkisi azalacak biçimde LGS gününe taşınır; belirsizlik aralığı eklenir.</td><td><b>Aralık olarak</b> okuyun. Aralık genişse veri az ya da sonuçlar dalgalıdır.</td></tr>
<tr><td>Başarı ağacı</td><td>Gelişim: akademik + sosyal + meyveler + kayıt sayısı/çeşitliliği. Canlılık: son 14 gündeki kayıtlar, son deneme değişimi, uzun süre kayıtsızlık.</td><td>Sonbahar/kış “ilgilenme zamanı” işaretidir, başarısızlık değildir.</td></tr></tbody></table></div>
<h4>Durum etiketleri</h4><ul><li><b>Destek öncelikli:</b> 2 veya daha fazla uyarı ya da akademik %50 altı.</li><li><b>İyi gidiyor:</b> uyarı yok ve akademik %70 ve üzeri.</li><li><b>Takipte:</b> diğerleri. <b>Veri bekleniyor:</b> deneme ve not yok.</li></ul>
<h4>Uyarıların kuralları</h4><ul><li>Netlerde ayda 1,5’ten fazla düşüş eğilimi (3+ deneme) ya da son denemede 6+ net düşüş</li><li>Devamsızlık 8 gün ve üzeri · 2+ disiplin kaydı</li><li>Herhangi bir ilişki puanı 3’ün altında</li><li>4+ konu “Tekrar gerekli”</li><li>Ders gücü %40’ın altında olan dersler</li><li>Öğrencinin son 3 ruh hâli paylaşımının ortalaması 2 veya altı</li></ul>
<h4>Yorumlama adımları</h4><ol><li><b>Eğilime bakın</b>, tek sınava değil.</li><li><b>Katsayısı 4 olan zayıf derse</b> odaklanın; en hızlı puan artışı oradadır.</li><li><b>Konu haritası ve yanlış defteri</b> ile “neden” sorusunu yanıtlayın (bilgi eksikliği mi, dikkat mi, süre mi?).</li><li><b>Sosyal ve ilişki göstergelerini</b> görüşme konusu yapın; öğrenciye etiket gibi söylemeyin.</li><li>Kararı yazın, <b>takip tarihi</b> koyun ve tarih gelince sonucu değerlendirin.</li></ol>
<div class="key"><b>Yapılmaması gerekenler:</b> Öğrencileri listeyi yansıtarak birbirleriyle kıyaslamak (gerekirse Ayarlar › Güvenlik › “İsimleri gizle”), göstergeleri tanı gibi sunmak, dijital ikiz sonuçlarını zorunlu hedef gibi sunmak, ilişki/ruh hâli bilgilerini veliyle paylaşmak.</div>`),
gsec('✅ 5. Öğrenci eklemeleri ve onay',`<ul><li>Öğrenciler <b>deneme sonucu, ders notu ve etkinlik</b> ekleyebilir. Bunlar “⏳ Onay bekliyor” olarak gelir ve <b>onaylanana kadar hesaplara katılmaz</b>.</li><li>Onaylamak için: Sınıf › Bekleyen işler ya da ilgili tablodaki “✔ Onayla”. Yanlışsa “Reddet”.</li><li>Öğrenci onay bekleyen kaydını düzeltebilir veya silebilir; onaylanmış kayıtları ve sizin girdiğiniz kayıtları değiştiremez.</li><li><b>Konular, yanlış defteri, çalışma günlüğü ve plan görevleri</b> öğrencinin kendi takibidir; onay gerektirmez.</li><li>Öğrencinin <b>göremedikleri:</b> ilişki puanları, görüşme kayıtları, devamsızlık/davranış kayıtları, rehber ekranındaki uyarılar. Öğrenci; öneri metinlerinin kendisine hitap eden sürümünü ve sizin “Tavsiyeler”e yazdıklarınızı görür.</li></ul>`),
gsec('⚠️ 6. Kritik bilgiler',`<div class="key"><ul style="margin:0"><li><b>Veriler yalnızca bu bilgisayarın bu tarayıcısında saklanır.</b> Tarayıcı geçmişi/site verileri temizlenirse kayıtlar silinir. Başka tarayıcıda veya bilgisayarda uygulama boş açılır.</li><li><b>Düzenli yedek alın</b> (haftada bir): Ayarlar › Yedekleme › JSON (tam yedek) veya Excel. Taşımak için yedeği diğer bilgisayarda “Geri yükle” ile açın.</li><li>Yedek dosyaları <b>kişisel veri</b> içerir; güvenli yerde saklayın, paylaşmayın (KVKK).</li><li><b>Öğrenci girişi şifresizdir:</b> öğrenciler isim listesinden adlarını seçerek girer; misafir modundaki kayıtlar öğrenci adını ekleyene kadar kalıcı olmaz. Bu yüzden öğrenci ekranında hassas bilgiler gösterilmez. Öğrencilerle “yalnızca kendi adınla gir” kuralını konuşun.</li><li>Ortak bilgisayarda işiniz bitince <b>🔒 Kilitle</b>’ye basın. Otomatik kilit varsayılan 15 dakikadır (Ayarlar › Güvenlik).</li><li>Rehber şifresi unutulursa kurtarılamaz; tarayıcı verisini silip yedekten dönmek gerekir.</li><li>Tarayıcı deposu yaklaşık 5 MB’tır; doluluk Ayarlar › Yedekleme’de görünür. Kayıt yapılamazsa uygulama kırmızı uyarı verir.</li><li>Veli raporunda “Hassas bölümler” kapalı kalmalıdır.</li></ul></div>`),
gsec('❓ 7. Sık sorulanlar',`<p><b>Öğrenci adını yazınca giremiyor.</b> Ad ve soyad kayıttakiyle aynı olmalı (büyük/küçük harf ve ç, ş, ğ, ı, ö, ü farkı önemli değil). Ayarlar › Öğrenciler’den yazımı kontrol edin.</p><p><b>Grafik boş görünüyor.</b> Onaylı deneme yoktur ya da öğrencinin eklediği deneme onay bekliyordur.</p><p><b>Tahmin çok iyimser/kötümser.</b> Az deneme vardır; aralığı dikkate alın, 3–4 deneme sonrası netleşir.</p><p><b>3B ağaç açılmıyor ya da yavaş.</b> Eski cihazlarda 3B desteklenmeyebilir; “2B” düğmesine basın.</p><p><b>Doğa sesi gelmiyor.</b> Tarayıcılar sesi ancak bir dokunuştan sonra başlatır: “Doğa seslerini aç” düğmesine basın ve cihaz sesini kontrol edin.</p><p><b>Excel yedeği geri yüklenmiyor.</b> Yalnızca bu uygulamanın ürettiği Excel dosyaları geri yüklenebilir (gizli “_yedek” sayfası gerekir). En güvenli yöntem JSON yedeğidir.</p>`)
].join('')}
function studentGuide(){return [
gsec('👋 Hoş geldin!',`<p>Bu uygulama senin <b>LGS yolculuk defterin</b>. Denemelerini, konularını, okuduğun kitapları ve etkinliklerini kaydettikçe <b>başarı ağacın</b> büyür, meyve verir; altın ve rozet kazanırsın.</p><h4>Nasıl giriş yaparım?</h4><ol><li>Giriş ekranındaki <b>“Öğrenci girişi”</b> kutusunda listeden <b>adına dokun</b> (ya da adını yazıp ara).</li><li>Adın listede yoksa <b>“👤 Misafir olarak gir”</b>: uygulamayı keşfet, sonra en üstteki kutuya adını ve sınıfını yazıp <b>“Adımı ekle”</b>ye bas. Artık listeden kendi adınla girebilirsin. (Misafirken eklediklerin, adını eklemezsen çıkışta silinir.)</li><li>İşin bitince sağ üstteki <b>🚪 Çıkış</b>’a bas.</li></ol>`,true),
gsec('🗺️ Menüler',`<ul><li><b>🏠 Ana sayfa:</b> Günün özeti, ruh hâlin, sıradaki görevlerin, sana özel öneriler.</li><li><b>🌳 Başarı ağacım:</b> Ağacını 2B veya 3B gör; 3B’de etrafında dön, yakınlaş, yukarı-aşağı bak. Doğa seslerini açabilirsin.</li><li><b>📝 Denemelerim:</b> Deneme netlerini gir, gelişim grafiğini izle.</li><li><b>📚 Çalışmalarım:</b> Konularım (hangisini bitirdin?), Yanlış defterim, Çalışma günlüğüm (süre ve soru sayısı), Notlarım.</li><li><b>📅 Planım:</b> Haftalık görevlerin; hazır planlardan birini seçebilir, kendi görevini ekleyebilirsin.</li><li><b>🏅 Etkinliklerim:</b> Kitap, spor, proje, gezi… Her biri altın kazandırır.</li><li><b>⭐ Hedeflerim:</b> Hedef lisen ve gereken puan, rozetlerin, dijital ikizlerin.</li><li><b>🧭 Meslek keşfi:</b> İlgi alanlarına ve güçlü derslerine uygun meslekleri keşfet. <b>“Gelecekteki ben”</b> sahnesinde kendini o meslekte çalışırken 2B ya da 3B gör; meslek değiştir, karakterinin saçını ve rengini düzenle.</li><li><b>💬 Rehberim:</b> Rehber öğretmeninin tavsiyeleri, mesajlaşma ve görüşme talebi.</li><li><b>🎨 Görünüm:</b> Kendi temanı seç; bazı temalar altınla açılır.</li></ul>`),
gsec('🌳 Ağacım nasıl büyür?',`<ul><li>Her deneme, tamamlanan konu, okunan kitap, etkinlik ve tamamlanan görev ağacını <b>büyütür</b>: tohum → filiz → fide → fidan → genç ağaç → meyveli ağaç.</li><li><b>Meyveler</b> farklı yönlerini gösterir: 🔴 Başarı, 🟣 Bilgelik, 🟡 Sorumluluk, 🩷 İyi niyet, 🔵 Yardımseverlik, 🟠 Sosyallik. Her biri 35 puanda belirir, 60 ve 80’de çoğalır.</li><li><b>Canlılık</b>, düzenli kayıt girdikçe artar. Uzun süre kayıt girmezsen ağacın sonbahara, sonra kışa girer. Bu bir not değil; “biraz ilgilen beni” demektir!</li><li>Ağacın, kişiliğini ya da değerini ölçmez. Herkesin ağacı kendi hızında büyür.</li></ul>`),
gsec('🪙 Altın, seviye ve rozetler',`<ul><li>Etkinlikler türüne ve düzeyine göre altın kazandırır (okul 5, ilçe 10, il 20, ulusal 40, uluslararası 80 ek altın). Rehber öğretmenin ek altın verebilir.</li><li>Seviyeler: <b>Filiz</b> (0) → <b>Kâşif</b> (50) → <b>Usta</b> (150) → <b>Uzman</b> (300) → <b>Efsane</b> (500).</li><li><b>Uzay</b> teması 150, <b>Altın Kupa</b> teması 300 altında açılır.</li><li>Rozetler; kitap okuma, netlerin artması, çözülen yanlışlar ve tamamlanan görevler gibi başarılarla açılır.</li></ul>`),
gsec('⏳ Onay nedir?',`<p>Eklediğin <b>deneme sonucu, ders notu ve etkinlik</b> rehber öğretmeninin onayına gider. Onaylanınca grafiklerine, altınına ve ağacına yansır. Onay beklerken kaydını düzeltebilir veya silebilirsin. Konular, yanlış defteri, çalışma günlüğü ve plan görevleri onay gerektirmez.</p>`),
gsec('⏱️ Günde 10 dakikada verimli kullanım',`<ol><li><b>Ana sayfa</b>da ruh hâlini işaretle (10 saniye).</li><li>Bugünkü <b>görevini</b> tamamlayınca ✔ ile işaretle.</li><li><b>Çalışma günlüğüne</b> kaç dakika çalıştığını ve kaç soru çözdüğünü yaz.</li><li>Yanlış yaptığın 1–2 soruyu <b>nedeniyle birlikte</b> yanlış defterine yaz; birkaç gün sonra yeniden çöz ve “Çözüldü” yap.</li><li>Haftada bir <b>konularını</b> güncelle, <b>planını</b> gözden geçir.</li><li>Her denemeden sonra <b>netlerini</b> gir.</li></ol>
<div class="tip"><b>İpuçları:</b><ul style="margin:.3em 0 0"><li>Türkçe, Matematik ve Fen’in LGS katsayısı 4’tür: bu derslerde 1 net ≈ 6 puan.</li><li>Yanlış defterindeki “neden”lere bak: çoğu dikkat hatasıysa süre ve okuma üzerine çalış.</li><li>Kendini başkalarıyla değil, geçen haftaki hâlinle karşılaştır.</li><li>Dijital ikizler “şöyle çalışırsam ne olur?” sorusuna örnek bir cevaptır, zorunlu hedef değildir.</li><li>Dinlenmek, uyku, spor ve arkadaşlar da başarının parçasıdır; planına ekle.</li></ul></div>`),
gsec('⚠️ Önemli bilgiler',`<div class="key"><ul style="margin:0"><li><b>Yalnızca kendi adınla giriş yap.</b> Başkasının adıyla girmek ve kayıtlarını değiştirmek doğru değildir.</li><li>Ortak bilgisayarda işin bitince mutlaka <b>🚪 Çıkış</b>’a bas.</li><li><b>Gerçek bilgileri yaz.</b> Uygulama sana yardım etmek için var; netlerini olduğundan farklı yazmak sana yardım etmez.</li><li>Ruh hâlin ve mesajların yalnızca rehber öğretmenine görünür. <b>Acil ya da seni çok üzen bir durumda</b> uygulamaya yazmakla yetinme; hemen rehber öğretmenine, öğretmenine ya da ailene git.</li><li>Kayıtların bu bilgisayarda saklanır; başka bilgisayarda görünmez.</li></ul></div>`),
gsec('❓ Sık sorulanlar',`<p><b>Adımı yazınca giremiyorum.</b> Ad ve soyadını birlikte yaz. Yine olmazsa rehber öğretmenine kaydının nasıl yazıldığını sor.</p><p><b>Denememi ekledim ama grafikte yok.</b> Rehber öğretmenin onaylayınca görünür.</p><p><b>Ağacım neden sonbaharda?</b> Bir süredir kayıt girilmemiş ya da son denemede küçük bir düşüş olmuş olabilir. Yeni bir çalışma kaydı ekle!</p><p><b>3B ağaç dönmüyor.</b> Parmağınla ya da fareyle sürükle; iki parmakla yakınlaş. Cihazın desteklemiyorsa 2B görünümü kullan.</p><p><b>Ses gelmiyor.</b> “Doğa seslerini aç” düğmesine bas ve cihazının sesini kontrol et.</p>`)
].join('')}

const xt=a=>a.ex.map((e,i)=>[a.pts[i][0],fmtDate(e.tarih).slice(0,5)]);
function examChart(a,withForecast=true){
 if(!a.n)return empty('📝','Henüz onaylı deneme yok.');
 const ser=[{name:'Toplam net',color:'var(--ac)',pts:a.ex.map((e,i)=>[a.pts[i][0],netTot(e),e.ad]),area:true}];let band=null,marks=[],xticks=xt(a);
 if(withForecast&&a.n>=2){const end=(toDate(db.lgs)-a.t0)/864e5,lx=a.pts[a.n-1][0];if(end>lx){band=[];for(let i=0;i<=8;i++){const x=lx+(end-lx)*i/8,d=ymd(new Date(a.t0+x*864e5)),f=forecast(a,d);band.push([x,f.lo,f.hi])}
  ser.push({name:'Olası gidişat',color:'var(--ac)',dash:1,pts:band.map(b=>[b[0],(b[1]+b[2])/2])});marks.push({x:end,label:'LGS'});xticks=[xticks[0],xticks[xticks.length-1],[end,fmtDate(db.lgs).slice(0,5)]]}}
 return lineChart({series:ser,band,bandName:'Olası aralık',ymin:0,ymax:90,yticks:[0,30,60,90],xticks:thin(xticks),marks,label:'Deneme gelişimi'});
}
const thin=(t,n=6)=>t.length<=n?t:t.filter((_,i)=>i%Math.ceil(t.length/n)===0||i===t.length-1);
function subjectBars(a){return hbars(a.subs.map((x,i)=>({label:`${E(x.name)} <span class="mu">×${x.w}</span>`,value:x.p,right:x.p==null?'—':'%'+Math.round(x.p),color:x.p==null?'var(--bd)':x.p>=70?'var(--ok)':x.p<50?'var(--bad)':'var(--warn)'})))}
function riskList(r){return r.length?`<div class="list">${r.map(x=>`<div class="item alert">⚠️ <div class="grow">${E(x)}</div></div>`).join('')}</div>`:`<div class="item note">✅ <div class="grow">Şu an dikkat gerektiren bir durum görünmüyor.</div></div>`}
function adviceList(s,a,stu,noRel){const L=advice(s,a).filter(x=>(stu?x[2]:x[1])&&!(noRel&&x[0]==='İlişki'));return `<div class="list">${L.map(x=>`<div class="item note"><span class="pill ac">${E(x[0])}</span><div class="grow">${E(stu?x[2]:x[1])}</div></div>`).join('')}</div>`}
function goldBlock(a){const nx=nextLvl(a.gold),prevL=[...LEVELS].reverse().find(L=>L[0]<=a.gold);const p=nx?(a.gold-prevL[0])/(nx[0]-prevL[0])*100:100;return `<div class="row between"><b>${E(lvl(a.gold))} · ${a.gold} 🪙</b><span class="mu">${nx?`${nx[1]} seviyesine ${nx[0]-a.gold} altın`:'En üst seviye 👑'}</span></div><div class="bar" style="margin-top:6px"><i style="width:${p}%;background:var(--a2)"></i></div>`}
function lgsBox(a){const f=a.n?forecast(a,db.lgs):null;if(!f)return '—';return `${rd(f.lo,0)}–${rd(f.hi,0)} net`}
function weightNote(){return `<p class="mu" style="margin-top:10px">ℹ️ LGS’de Türkçe, Matematik ve Fen Bilimleri katsayısı 4; İnkılap, Din Kültürü ve İngilizce katsayısı 1’dir. Bu yüzden ilk üç derste 1 net ≈ 5,9 puan, diğerlerinde ≈ 1,5 puan getirir (yaklaşık).</p>`}
function badgeGrid(s,a){const b=badges(s,a);return b.length?`<div class="grid g3">${b.map(x=>`<div class="kpi" style="text-align:center"><div style="font-size:2rem">${x[0]}</div><b style="font-size:1em">${E(x[1])}</b><span>${E(x[2])}</span></div>`).join('')}</div>`:empty('🎖️','Henüz rozet yok. Etkinlik, deneme ve görevlerle rozetler açılır.')}

 const L=db.students.map(x=>({x,...status(x)})),cnt=t=>L.filter(l=>l.t===t).length,ib=inbox(),d=daysTo(db.lgs);
 const warn=(db.pwDefault||db.pwHash==='')?`<div class="callout warn s12">🔐 ${db.pwHash===''?'Şifre koruması kapalı.':'Eski sürümün herkesçe bilinen varsayılan şifresi kullanılıyor.'} ${B('Şifreyi şimdi belirleyin','gotoSec',{},'btn sm')}</div>`:'';

 const cd=`<div class="card s4" style="text-align:center;display:flex;flex-direction:column;justify-content:center"><small class="mu" style="font-weight:700;letter-spacing:.04em">LGS’YE KALAN</small><div style="font-size:3.2rem;font-weight:800;color:var(--ac);line-height:1.1">${Math.max(0,d)}</div><b>gün</b><p class="mu">${fmtDate(db.lgs)}</p>${(()=>{const tot=300,p=cl((tot-d)/tot*100,0,100);return `<div class="bar"><i style="width:${p}%"></i></div>`})()}</div>`;
 if(!db.students.length)return `<div class="dash">${warn}${hero}${cd}</div>`+addStudentCard(true);
 const real=L.filter(l=>!l.x.sample),act=L.filter(l=>l.a.lastTot!=null),avgNet=av(act.map(l=>l.a.lastTot));
 const kp=`<div class="s3">${kpi('Öğrenci',real.length,L.length-real.length?`+${L.length-real.length} örnek`:'kayıtlı','',{ic:'👩‍🎓',col:'#4c6ef5'})}</div><div class="s3">${kpi('Destek öncelikli',cnt('oncelik'),'2+ uyarı / akademik &lt; 50','bad-t',{ic:'🚨',col:'var(--bad)'})}</div><div class="s3">${kpi('Takipte',cnt('takip'),'izlenmeye devam','warn-t',{ic:'👀',col:'var(--warn)'})}</div><div class="s3">${kpi('İyi gidiyor',cnt('iyi'),'uyarı yok, akademik ≥ 70','ok-t',{ic:'🌟',col:'var(--ok)'})}</div>`;
 const inb=`<div class="card s7"><div class="card-head"><h3>🔔 Bekleyen işler <span class="badge" style="${ib.length?'':'background:var(--ok)'}">${ib.length}</span></h3></div>${ib.length?`<div class="list">${ib.slice(0,UI.allIb?999:6).map(inboxItem).join('')}</div>${ib.length>6?`<div class="mt">${B(UI.allIb?'Daha az göster':`Tümünü göster (+${ib.length-6})`,'allIb',{},'btn ghost sm')}</div>`:''}`:empty('✅','Bekleyen onay, talep veya takip yok.')}</div>`;

 const cls=`<div class="card s5"><h3>📊 Sınıf görünümü</h3><div class="row between"><span class="mu">Son deneme ortalaması</span><b style="font-size:1.3em">${avgNet!=null?rd(avgNet)+' net':'—'}</b></div><div class="bar" style="margin:8px 0 14px;height:12px;display:flex"><i style="width:${cnt('oncelik')/L.length*100}%;background:var(--bad);border-radius:0"></i><i style="width:${cnt('takip')/L.length*100}%;background:var(--warn);border-radius:0"></i><i style="width:${cnt('iyi')/L.length*100}%;background:var(--ok);border-radius:0"></i></div><h4>Ders bazında sınıf gücü</h4>${hbars(sp.map(x=>({label:E(x.n),value:x.v,right:x.v==null?'—':'%'+Math.round(x.v),color:x.v==null?'var(--bd)':x.v>=70?'var(--ok)':x.v<50?'var(--bad)':'var(--warn)'})))}</div>`;
 const list=`<div class="card s12"><div class="card-head"><h3>👩‍🎓 Öğrenciler</h3><div class="row"><input data-i="q" value="${E(UI.q)}" placeholder="🔎 Ad veya sınıf ara" aria-label="Öğrenci ara" style="width:200px;flex:1"><select data-c="flt" aria-label="Filtre" style="width:auto">${[['all','Tümü'],['oncelik','Destek öncelikli'],['takip','Takipte'],['iyi','İyi gidiyor'],['veri','Veri bekleniyor'],['real','Gerçek öğrenciler'],['sample','Örnek öğrenciler']].map(o=>`<option value="${o[0]}" ${UI.flt===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><select data-c="sort" aria-label="Sırala" style="width:auto">${[['ad','Ada göre'],['net','Son nete göre'],['risk','Uyarıya göre']].map(o=>`<option value="${o[0]}" ${UI.sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div><div id="plist">${plist()}</div></div>`;
 return `<div class="dash">${warn}${hero}${cd}${kp}${inb}${cls}${list}</div>`+addStudentCard(false);

function plist(){

 L=L.filter(l=>(!q||lc(l.x.name+' '+l.x.sinif).includes(q))&&(UI.flt==='all'||l.t===UI.flt||(UI.flt==='real'&&!l.x.sample)||(UI.flt==='sample'&&l.x.sample)));
 L.sort((p,r)=>UI.sort==='net'?(r.a.lastTot??-1)-(p.a.lastTot??-1):UI.sort==='risk'?r.r.length-p.r.length:p.x.name.localeCompare(r.x.name,'tr'));
 return L.length?`<div class="people">${L.map(({x,a,r,t})=>`<button type="button" class="person" data-a="openStudent" data-id="${E(x.id)}">${avatar(x)}<span class="grow"><b>${E(NM(x.name))}</b><small class="mu">${E(x.sinif||'—')} · ${a.lastTot!=null?rd(a.lastTot)+' net':'deneme yok'}${x.sample?' · örnek':''}</small><span style="display:block;margin-top:4px">${pill(STATUS[t][0],STATUS[t][1])}</span></span></button>`).join('')}</div>`:empty('🔍','Bu filtreye uyan öğrenci yok.');
}

function inboxItem(it){
 const s=it.s,nm=`<a href="#" data-a="openStudent" data-id="${E(s.id)}">${E(NM(s.name))}</a>`;
 if(it.type==='yeni')return `<div class="item">🆕<div class="grow">${nm} kendini öğrenci olarak kaydetti${s.sinif?' · '+E(s.sinif):''}<br><small class="mu">${fmtDate(s.selfReg)} · Bu öğrenci sizin öğrenciniz mi?</small></div><div class="row">${B('✔ Onayla','regOk',{id:s.id},'btn ok sm')}${B('Sil','regDel',{id:s.id},'btn danger sm')}</div></div>`;
 if(it.type==='onay'){const lab={exams:'deneme sonucu',grades:'ders notu',acts:'etkinlik'}[it.k];const det=it.k==='exams'?`${E(it.x.ad)} · ${rd(netTot(it.x))} net`:it.k==='grades'?`${E(it.x.ders)}: ${rd(num(it.x.d1))} / ${rd(num(it.x.d2))}`:`${E(it.x.tur)}: ${E(it.x.ad)}`;
  return `<div class="item">⏳<div class="grow">${nm} yeni bir ${lab} ekledi<br><small class="mu">${det}</small></div><div class="row">${B('✔ Onayla','approve',{k:it.k,id:it.x.id,sid:s.id},'btn ok sm')}${B('Reddet','reject',{k:it.k,id:it.x.id,sid:s.id},'btn danger sm')}</div></div>`}
 if(it.type==='randevu')return `<div class="item">📩<div class="grow">${nm} görüşme talep etti · ${fmtDate(it.x.tarih)}<br><small class="mu">${E(it.x.konu)}</small></div>${B('Aç','openStudent',{id:s.id,to:'rehberlik'},'btn ghost sm')}</div>`;
 if(it.type==='mesaj')return `<div class="item">✉️<div class="grow">${nm} mesaj gönderdi<br><small class="mu">${E(String(it.x.metin).slice(0,90))}</small></div>${B('Yanıtla','openMsg',{id:s.id},'btn ghost sm')}</div>`;
 return `<div class="item">🗓️<div class="grow">${nm} · takip görüşmesi zamanı (${fmtDate(it.x.takip)})<br><small class="mu">${E(it.x.konu)}</small></div>${B('Yapıldı','followDone',{sid:s.id,id:it.x.id},'btn ghost sm')}</div>`;
}

function addStudentCard(first){return `<details class="fold" ${first?'open':''}><summary>＋ Öğrenci ekle</summary><form data-form="_addS"><div class="fm"><label>Ad soyad * <span style="font-weight:400">(öğrenci girişte bunu yazar)</span><input name="name" required maxlength="80" placeholder="örn. Elif Yılmaz"></label><label>Sınıf<input name="sinif" value="8-A" maxlength="20"></label></div><div class="row"><button class="btn" type="submit">Ekle</button>${first?B('🧪 Kurgusal örnek sınıfı yükle','loadSamples',{},'btn ghost'):''}</div></form></details>`}
SUBMIT._addS=(k,f)=>{const n=f.elements.name.value.trim();if(!n)return toast('Ad soyad gerekli.','err');const s=normStudent({id:uid(),name:n,sinif:f.elements.sinif.value.trim()});db.students.push(s);db.cur=s.id;save();render();toast('👩‍🎓 '+n+' eklendi.')};
ACT.loadSamples=()=>{let n=0;SAMPLE_NAMES.forEach((_,i)=>{if(!db.students.some(x=>same(x.id,-800001-i))){db.students.push(makeSample(i));n++}});if(!db.cur&&db.students.length)db.cur=db.students[0].id;save();render();toast(n?`🧪 ${n} kurgusal öğrenci eklendi.`:'Örnek öğrenciler zaten yüklü.')};

 <div class="s2">${kpi('Sosyal',a.social,'ilişki · etkinlik · davranış','',{ic:'🤝',col:'#f76707'})}</div>

 <div class="card s8"><div class="card-head"><h3>📈 Deneme gelişimi</h3>${a.n>=2?`<span class="pill ${a.b>=0?'ok':'bad'}">${a.b>=0?'▲':'▼'} ${rd(Math.abs(a.b*30))} net/ay</span>`:''}</div>${examChart(a,false)}</div>

P.akademik=(s,a)=>{const T=tabs('aka',[['den','📝 Denemeler'],['not','📚 Ders notları'],['kon','🎯 Konular'],['yan','❌ Yanlış defteri']]);return head('Akademik',E(NM(s.name)))+T.html+({den:examsPage,not:gradesPage,kon:topicsPage,yan:mistakesPage}[T.cur])(s,a)};
function examsPage(s,a){
 const best=a.n?Math.max(...a.ex.map(netTot)):null;
 let h=`<div class="kpis">${kpi('Onaylı deneme',a.n)}${kpi('Son toplam',a.lastTot!=null?rd(a.lastTot)+' net':'—')}${kpi('Yaklaşık puan',a.lastW!=null?rd(lgsPuan(a.lastW),0):'—','ağırlıklı ham netten')}${kpi('En yüksek',best!=null?rd(best)+' net':'—')}</div>`;
 h+=`<div class="card"><div class="card-head"><h3>📈 Gelişim</h3><div class="tabs" style="margin:0">${['2B','3B'].map((x,i)=>`<button type="button" class="${UI.c3d===!!i?'on':''}" data-a="c3d" data-v="${i}">${x}</button>`).join('')}</div></div>${UI.c3d?(a.n?chart3D({rows:a.ex.map(e=>e.tarih?fmtDate(e.tarih).slice(0,5):String(e.ad).slice(0,8)),cols:SUB.map(x=>x[1].split(' ')[0]),vals:a.ex.map(e=>SUB.map(x=>num(e[x[0]])==null?null:num(e[x[0]])/x[2]*100)),max:100,colors:SUBCOL,label:'Denemelerin ders bazlı 3B görünümü',fmt:v=>'%'+Math.round(v)})+'<p class="mu">Sütun yüksekliği: o derste alınabilecek en yüksek nete göre yüzde.</p>'+`<div class="legend">${SUB.map((x,i)=>`<span><i style="background:${SUBCOL[i]}"></i>${x[1]}</span>`).join('')}</div>`:empty('📝','Henüz deneme yok.')):examChart(a)}</div>`;
 if(a.n)h+=card('📊 Ders bazlı durum',`<div class="tw"><table><thead><tr><th>Ders</th><th class="num">Katsayı</th><th class="num">Ortalama</th><th class="num">Son</th><th class="num">Başarı</th><th class="num">1 net ≈</th></tr></thead><tbody>${a.subs.map(x=>`<tr><td>${E(x.name)}</td><td class="num">×${x.w}</td><td class="num">${rd(x.avg)} / ${x.m}</td><td class="num">${rd(x.last)}</td><td class="num">${x.ep==null?'—':'%'+Math.round(x.ep)}</td><td class="num">${rd(400*x.w/WMAX)} puan</td></tr>`).join('')}</tbody></table></div>${weightNote()}`);
 h+=card('🗂️ Deneme kayıtları',crud('exams',{addLabel:'Deneme ekle',sort:(x,y)=>String(y.tarih).localeCompare(String(x.tarih)),cols:[['Toplam',x=>`<b>${rd(netTot(x))}</b>`,'num'],['≈ Puan',x=>rd(lgsPuan(netW(x)),0),'num']],formNote:'Net = doğru − yanlış ÷ 3. Boş bırakılan dersler 0 sayılmaz, hesaba katılmaz.',empty:'Henüz deneme kaydı yok.'}));
 return h;
}

function gradesPage(s,a){return `<div class="callout" style="margin-bottom:16px">LGS derslerinin notları, ders gücü hesabına deneme sonuçlarıyla birlikte (%40) katılır.</div>`+card('📚 Ders notları',crud('grades',{addLabel:'Not ekle',cols:[['Ortalama',x=>`<b>${rd(gradeOf(x))}</b>`,'num']]}))}
function topicsPage(s,a){
 const col={'Tamamlandı':'var(--ok)','Çalışılıyor':'var(--warn)','Tekrar gerekli':'var(--bad)','Başlanmadı':'var(--bd)'};
 const heat=SUB.map(([,n])=>{const z=s.topics.filter(t=>t.ders===n),dn=z.filter(t=>t.durum==='Tamamlandı').length;return `<div class="hbar"><div class="lbl"><span>${E(n)}</span><b>${dn}/${z.length}</b></div><div class="heat">${z.map(t=>`<i title="${E(t.konu)} — ${E(t.durum)}" style="background:${col[t.durum]||'var(--bd)'}"></i>`).join('')||'<span class="mu">Konu eklenmemiş</span>'}</div></div>`}).join('');
 return `<div class="grid g2"><div class="card"><h3>🗺️ Konu haritası</h3><div class="hbars">${heat}</div><div class="legend">${Object.entries(col).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('')}</div></div><div class="card"><h3>🎯 Konu listesi</h3>${crud('topics',{addLabel:'Konu ekle',sort:(x,y)=>x.ders.localeCompare(y.ders,'tr')})}</div></div>`;
}
function mistakesPage(s,a){
 const m=s.mistakes,solved=m.filter(x=>x.durum==='Çözüldü').length,c={};m.forEach(x=>c[x.neden]=(c[x.neden]||0)+1);

}

 if(!ro)h+=`<div class="card"><h3>➕ Görev ekle</h3><form data-form="plan" data-id=""><div class="fm"><label>Gün<select name="gun">${DAYS.map(d=>`<option>${d}</option>`).join('')}</select></label><label>Tür<select name="ders">${PLAN_KINDS.map(d=>`<option>${E(d)}</option>`).join('')}</select></label><label class="wide">Görev *<input name="gorev" required maxlength="200" placeholder="örn. 20 paragraf sorusu"></label><input type="hidden" name="durum" value="Planlandı"></div><p class="err bad-t"></p><button class="btn" type="submit">Ekle</button></form></div>`;

function requestsPage(s,a){

function thread(s,me){

function appearance(p,gold,sc){
 const cur=p.theme||(sc==='stu'?'kagit':'kagit');
 const prev=t=>`<div class="pv" style="background:${t.bg}"><div class="sb" style="background:${t.sf2}"></div><div class="mn"><i style="background:${t.tx};width:60%;opacity:.85"></i><div class="c" style="background:${t.sf};border:1px solid ${t.bd};display:flex;align-items:center;gap:5px;padding:0 6px"><i style="background:${t.ac};width:34%;height:8px"></i><i style="background:${t.a2};width:18%;height:8px"></i></div><i style="background:${t.mu};width:80%;opacity:.5"></i></div></div>`;
 return card('🎨 Tema',`<div class="themes">${THEMES.map(t=>{const lock=t.gold&&sc==='stu'&&gold<t.gold;const hide=t.gold&&sc!=='stu';if(hide)return '';return `<button type="button" class="th ${cur===t.id&&!p.auto?'on':''}" data-a="setPref" data-sc="${sc}" data-k="theme" data-v="${t.id}" ${lock||RO()?'disabled':''} aria-pressed="${cur===t.id}">${prev(t)}<div class="nm" style="background:${t.sf};color:${t.tx}"><span>${E(t.name)}</span><span>${lock?'🔒 '+t.gold+' 🪙':t.dark?'🌙':'☀️'}</span></div></button>`}).join('')}</div><label class="switch mt"><input type="checkbox" data-c="pref" data-sc="${sc}" data-k="auto" ${p.auto?'checked':''} ${RO()?'disabled':''}> Cihazın açık/koyu ayarını otomatik izle</label>`)+
 card('✏️ Kişiselleştirme',`<div class="fm"><label>Vurgu rengi<input type="color" data-c="pref" data-sc="${sc}" data-k="ac" value="${E(p.ac||(THEMES.find(t=>t.id===cur)||THEMES[0]).ac)}" ${RO()?'disabled':''}></label><label>Yazı tipi<select data-c="pref" data-sc="${sc}" data-k="ff" ${RO()?'disabled':''}>${Object.keys(FONTS).map(k=>`<option ${(p.ff||'Modern')===k?'selected':''}>${k}</option>`).join('')}</select></label><label>Yazı boyutu: ${cl(+p.fs||16,13,22)} px<input type="range" min="13" max="22" value="${cl(+p.fs||16,13,22)}" data-c="pref" data-sc="${sc}" data-k="fs" ${RO()?'disabled':''}></label></div><label class="switch"><input type="checkbox" data-c="pref" data-sc="${sc}" data-k="dense" ${p.dense?'checked':''} ${RO()?'disabled':''}> Sıkı yerleşim (ekrana daha çok bilgi)</label><label class="switch"><input type="checkbox" data-c="pref" data-sc="${sc}" data-k="nomo" ${p.nomo?'checked':''} ${RO()?'disabled':''}> Hareketleri azalt (animasyonları kapat)</label>${RO()?'':`<div class="row mt">${B('Vurgu rengini sıfırla','resetAc',{sc},'btn ghost sm')}${B('Tüm görünümü varsayılana döndür','resetLook',{sc},'btn ghost sm')}</div>`}<p class="mu mt">“Okunaklı” yazı tipi ve “Renk körü dostu”, “Yüksek kontrast” temaları erişilebilirlik için önerilir.</p>`);
}

function schoolSet(){return card('🏫 Okul bilgileri',`<form data-form="_school"><div class="fm"><label>Okul adı<input name="okul" value="${E(db.ui.okul)}" maxlength="80" placeholder="LGS Rehberlik Paneli"></label><label>Logo (emoji)<input name="logo" value="${E(db.ui.logo)}" maxlength="4" placeholder="🎓"></label><label>LGS tarihi<input name="lgs" type="date" value="${E(db.lgs)}"></label></div><button class="btn" type="submit">Kaydet</button></form><p class="mu mt">LGS tarihini MEB’in resmî sınav takviminden doğrulayın; geri sayım ve tahminler bu tarihe göre yapılır.</p>`)}
